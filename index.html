<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản đồ trực tuyến Tỉnh Thái Nguyên Mới</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCDZsHLfKmIonDcg_kC062sqEHL_-lg5z0",
            authDomain: "hanhtrinh-37064.firebaseapp.com",
            databaseURL: "https://hanhtrinh-37064-default-rtdb.firebaseio.com",
            projectId: "hanhtrinh-37064",
            storageBucket: "hanhtrinh-37064.firebasestorage.app",
            messagingSenderId: "13333747192",
            appId: "1:13333747192:web:9310bebd983882792eb20d",
            measurementId: "G-B11K1Q527F"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const defaultRegions = [
            { id: "p-tan-cuong", name: "Xã Tân Cương", region: "Thái Nguyên cũ", img: "" },
            { id: "p-pho-yen", name: "Phường Phổ Yên", region: "Thái Nguyên cũ", img: "" },
            { id: "p-song-cong", name: "Phường Sông Công", region: "Thái Nguyên cũ", img: "" },
            { id: "p-dinh-hoa", name: "Khu vực Định Hóa", region: "Thái Nguyên cũ", img: "" },
            { id: "bk-bac-kan", name: "Phường Bắc Kạn", region: "Bắc Kạn sáp nhập", img: "" },
            { id: "bk-ba-be", name: "Khu vực Hồ Ba Bể", region: "Bắc Kạn sáp nhập", img: "" },
            { id: "bk-cho-don", name: "Huyện Chợ Đồn", region: "Bắc Kạn sáp nhập", img: "" },
            { id: "bk-cho-moi", name: "Huyện Chợ Mới", region: "Bắc Kạn sáp nhập", img: "" }
        ];

        const regionsRef = ref(db, 'thai_nguyen_moi_2025_v2');
        
        window.saveDataToFirebase = function(data) {
            set(regionsRef, data);
        };

        onValue(regionsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                renderGrid(data);
            } else {
                renderGrid(defaultRegions);
                saveDataToFirebase(defaultRegions);
            }
        });
    </script>

    <style>
        :root{
          --bg: #0b1020;
          --muted: #93a2b8;
          --brand: #2563eb;
          --accent: #22c55e;
          --ring: 0 0 0 3px rgba(37,99,235,.25);
          --shadow: 0 10px 30px rgba(0,0,0,.35);
          --shadow-soft: 0 6px 18px rgba(0,0,0,.25);
        }

        *{box-sizing:border-box}
        html,body{height:100%}
        body{
          margin:0;
          font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
          color:#e7eefb;
          background:
            radial-gradient(1200px 600px at 80% -20%, #1f2a52 10%, transparent 60%),
            radial-gradient(1000px 500px at -10% 120%, #172144 10%, transparent 60%),
            var(--bg);
          background-attachment: fixed;
          line-height:1.55;
        }

        .art-title {
          text-align:center;
          font-family:'Dancing Script','Pacifico',cursive;
          font-size:32px;
          color:#ffde59;
          text-shadow: 2px 3px 6px rgba(0,0,0,.6);
          margin: 16px 0 4px;
        }

        .sub-title {
          text-align: center;
          font-size: 13px;
          color: var(--muted);
          margin-bottom: 16px;
        }

        #flag{
          position:fixed; top:16px; left:16px; width:40px; height:auto; z-index:1000;
          filter: drop-shadow(0 4px 10px rgba(0,0,0,.35));
          border-radius:6px; border:1px solid rgba(255,255,255,.12);
        }

        main{max-width:1100px; margin:0 auto 100px; padding:0 16px}

        /* Khung chứa hình ảnh bản đồ tích hợp */
        .map-container {
          width: 100%;
          max-width: 500px;
          margin: 0 auto 24px auto;
          border-radius: 16px;
          overflow: hidden;
          border: 1px solid rgba(255,255,255,0.15);
          box-shadow: var(--shadow);
          background: #111827;
        }
        .map-container img {
          width: 100%;
          height: auto;
          display: block;
          object-fit: cover;
        }

        #listGrid{
          display:grid;
          grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
          gap:14px;
        }

        .province{
          background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
          border:1px solid rgba(255,255,255,.1);
          border-radius:16px;
          padding:14px 10px;
          display:flex; flex-direction:column; align-items:center; gap:8px;
          box-shadow: var(--shadow-soft);
        }

        .tag-region {
          font-size: 10px;
          padding: 2px 6px;
          border-radius: 10px;
          background: rgba(37,99,235,0.25);
          color: #93c5fd;
          border: 1px solid rgba(37,99,235,0.4);
        }

        .circle{
          width:72px; height:72px; border-radius:50%;
          background: linear-gradient(135deg,#303c6b,#1b2547);
          display:flex; align-items:center; justify-content:center;
          font-size:22px; color:#cfe0ff; font-weight:800;
          position:relative; overflow:hidden;
          border:2px solid rgba(255,255,255,.12);
        }
        .circle img{ width:100%; height:100%; object-fit:cover; border-radius:50%; display:block }
        .circle input[type="file"]{
          position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; z-index:5;
        }

        input[type="text"]{
          width:100%; text-align:center; font-size:13px; font-weight:600;
          color:#eef4ff; background:transparent; outline:none; border:none;
          padding:4px; border-radius:8px;
        }
        input[type="text"]:focus{ background: rgba(37,99,235,.09); box-shadow: var(--ring) }

        #shareButton{
          position: fixed; right:20px; bottom:20px; z-index:60;
          background: linear-gradient(135deg, #4f8cff, #6aa9ff);
          color:white; border:none; padding:12px 18px; border-radius:14px;
          font-size:14px; font-weight:800;
          box-shadow: 0 14px 28px rgba(79,140,255,.35);
          cursor:pointer;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Pacifico&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
</head>
<body>

<img id="flag" src="https://upload.wikimedia.org/wikipedia/commons/2/21/Flag_of_Vietnam.svg" alt="Quốc kỳ Việt Nam">

<main>
    <h1 class="art-title">Bản đồ Trực tuyến Tỉnh Thái Nguyên Mới</h1>
    <div class="sub-title">Hợp nhất Thái Nguyên & Bắc Kạn (Hiệu lực từ 01/07/2025)</div>
    
    <!-- Tích hợp khung hiển thị bản đồ trực quan ngay trong giao diện -->
    <div class="map-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Location_of_Thai_Nguyen_Province_in_Vietnam.svg/800px-Location_of_Thai_Nguyen_Province_in_Vietnam.svg.png" alt="Bản đồ hành chính Thái Nguyên mở rộng">
    </div>

    <div id="listGrid"></div>
</main>

<button id="shareButton">Lưu & Đồng bộ</button>

<script>
    let currentData = [];

    function renderGrid(data) {
        currentData = data;
        const grid = document.getElementById('listGrid');
        grid.innerHTML = '';
        
        data.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'province';
            div.innerHTML = `
                <span class="tag-region">${item.region || 'Khu vực'}</span>
                <div class="circle">
                    ${item.img ? `<img src="${item.img}" alt="img">` : '📍'}
                    <input type="file" accept="image/*" onchange="handleImageUpload(event, ${index})">
                </div>
                <input type="text" value="${item.name}" onchange="handleNameChange(event, ${index})">
            `;
            grid.appendChild(div);
        });
    }

    function handleNameChange(event, index) {
        currentData[index].name = event.target.value;
        if (window.saveDataToFirebase) {
            window.saveDataToFirebase(currentData);
        }
    }

    function handleImageUpload(event, index) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                currentData[index].img = e.target.result;
                renderGrid(currentData);
                if (window.saveDataToFirebase) {
                    window.saveDataToFirebase(currentData);
                }
            };
            reader.readAsDataURL(file);
        }
    }

    document.getElementById('shareButton').addEventListener('click', () => {
        alert('Đã lưu và đồng bộ toàn bộ dữ liệu bản đồ trực tuyến!');
    });
</script>

</body>
</html>
